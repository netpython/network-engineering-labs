hostname R3
no ip domain-lookup
interface GigabitEthernet0/0
 ip address 10.0.23.2 255.255.255.252
 no shutdown
interface Loopback0
 ip address 198.51.100.1 255.255.255.255
 no shutdown
router ospf 10
 router-id 3.3.3.3
 passive-interface Loopback0
 network 10.0.23.0 0.0.0.3 area 10
 network 198.51.100.1 0.0.0.0 area 10
end
