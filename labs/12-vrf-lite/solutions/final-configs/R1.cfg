hostname R1
no ip domain-lookup
interface GigabitEthernet0/0
 no shutdown
interface GigabitEthernet0/1
 no shutdown
ip vrf BLUE
 rd 65000:10
ip vrf RED
 rd 65000:20
interface GigabitEthernet0/0
 ip vrf forwarding BLUE
 ip address 10.10.10.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 ip vrf forwarding RED
 ip address 10.10.10.1 255.255.255.0
 no shutdown
end
